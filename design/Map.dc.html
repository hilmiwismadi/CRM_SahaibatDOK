<helmet>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .app h1, .app h2, .app .heading { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #0891b2; text-decoration: none; }
    a:hover { color: #0e7490; }
    .nav-item { transition: background 120ms ease; }
    .nav-item:hover { background: rgba(255,255,255,0.07); }
    .list-row { transition: background 100ms ease; cursor: pointer; }
    .list-row:hover { background: #f8fafc; }
    .pill-btn { transition: filter 100ms ease; cursor: pointer; border: none; }
    .pill-btn:hover { filter: brightness(0.96); }
    .icon-btn { transition: background 120ms ease; cursor: pointer; }
    .icon-btn:hover { background: #f1f5f9; }
    .search-input:focus { outline: none; border-color: #0891b2 !important; box-shadow: 0 0 0 3px rgba(8,145,178,0.12); }
    .pin { transition: transform 120ms ease; cursor: pointer; }
    .pin:hover { transform: translate(-50%,-100%) scale(1.12); }
    .list-scroll::-webkit-scrollbar { width: 8px; }
    .list-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
    .drawer-scroll::-webkit-scrollbar { width: 8px; }
    .drawer-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
  </style>
</helmet>

const LEADS = RAW_LEADS.map((l, i) => Object.assign({ id: "l" + i }, l));
const LATS = LEADS.map((l) => l.lat);
const LNGS = LEADS.map((l) => l.lng);
const MIN_LAT = Math.min.apply(null, LATS);
const MAX_LAT = Math.max.apply(null, LATS);
const MIN_LNG = Math.min.apply(null, LNGS);
const MAX_LNG = Math.max.apply(null, LNGS);

function project(lat, lng) {
  const xPct = 8 + ((lng - MIN_LNG) / (MAX_LNG - MIN_LNG)) * 84;
  const yPct = 8 + ((MAX_LAT - lat) / (MAX_LAT - MIN_LAT)) * 84;
  return { xPct: xPct, yPct: yPct };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: "", filter: "all", selectedId: null };
    this.advanceStage = (leadId, toKey) => {
      const lead = LEADS.find((l) => l.id === leadId);
      if (lead) lead.stage = toKey;
      this.setState({});
    };
  }

  renderVals() {
    const query = this.state.query.toLowerCase();
    const stageCounts = {};
    LEADS.forEach((l) => { stageCounts[l.stage] = (stageCounts[l.stage] || 0) + 1; });

    const filterPills = ["all"].concat(Object.keys(STAGES)).map((key) => {
      const active = this.state.filter === key;
      const def = key === "all" ? { label: "All", color: "#0f172a", text: "#fff" } : STAGES[key];
      const count = key === "all" ? LEADS.length : (stageCounts[key] || 0);
      return {
        key: key,
        label: def.label + " (" + count + ")",
        onClick: () => this.setState({ filter: key }),
        style_bg: active ? def.color : "#f1f5f9",
        style_color: active ? def.text : "#475569"
      };
    });

    const visible = LEADS.filter((l) => {
      const matchesFilter = this.state.filter === "all" || l.stage === this.state.filter;
      const matchesQuery = query === "" || l.name.toLowerCase().indexOf(query) !== -1 || l.category.toLowerCase().indexOf(query) !== -1;
      return matchesFilter && matchesQuery;
    });

    const rows = visible.map((l) => {
      const def = STAGES[l.stage];
      return Object.assign({}, l, {
        stageColor: def.color,
        rowBg: this.state.selectedId === l.id ? "#f0f9fb" : "#ffffff",
        onClick: () => this.setState({ selectedId: l.id })
      });
    });

    const pins = visible.map((l) => {
      const def = STAGES[l.stage];
      const pos = project(l.lat, l.lng);
      const isSelected = this.state.selectedId === l.id;
      return Object.assign({}, l, {
        xPct: pos.xPct.toFixed(2),
        yPct: pos.yPct.toFixed(2),
        color: def.color,
        size: isSelected ? 40 : 30,
        ring: isSelected ? "#0f172a" : "#ffffff",
        ringWidth: isSelected ? 2 : 1.5,
        z: isSelected ? 20 : 10,
        onClick: () => this.setState({ selectedId: l.id })
      });
    });

    const legend = Object.keys(STAGES).map((key) => ({ label: STAGES[key].label, color: STAGES[key].color }));

    const selectedRaw = LEADS.find((l) => l.id === this.state.selectedId) || null;
    const selected = selectedRaw ? Object.assign({}, selectedRaw, {
      stageLabel: STAGES[selectedRaw.stage].label,
      stageColor: STAGES[selectedRaw.stage].color,
      stageText: STAGES[selectedRaw.stage].text,
      phone: selectedRaw.phone || "No phone number scraped",
      ratingDisplay: selectedRaw.rating > 0 ? selectedRaw.rating.toFixed(1) + " (" + selectedRaw.reviews + " reviews)" : "No ratings yet"
    }) : null;

    const transitions = selected ? TRANSITIONS.filter((t) => t.from === selected.stage).map((t) => ({
      label: t.label,
      onClick: () => this.advanceStage(selected.id, t.to)
    })) : [];

    return {
      accent: this.props.accent || "#0891b2",
      query: this.state.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      filterPills: filterPills,
      rows: rows,
      pins: pins,
      legend: legend,
      hasSelected: !!selected,
      selected: selected || {},
      transitions: transitions,
      closeDrawer: () => this.setState({ selectedId: null })
    };
  }
}
</script>
</body>
</html>
